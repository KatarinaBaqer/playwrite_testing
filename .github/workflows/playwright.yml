name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test
      - name: Archive last test run
        run: |
          chmod +x archive-last-run.sh
          ./archive-last-run.sh
      - name: Upload archived results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-archived-results
          path: test-results/archive-*.json
